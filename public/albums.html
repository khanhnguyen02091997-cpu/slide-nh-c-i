<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Album của tôi · Slide Ảnh Cưới</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a120b">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ảnh Cưới">
<script src="/js/pwa.js" defer></script>
</head>
<body>
<div class="topbar">
  <a class="brand" href="/albums.html">Slide Ảnh Cưới <em>trọn bộ</em></a>
  <div class="who"><a class="btn" id="adminLink" href="/admin.html" hidden>Quản lý mã</a><span id="email"></span><button id="out">Đăng xuất</button></div>
</div>
<div class="page">
  <div class="sec-h">
    <h1>Album <em>của tôi</em></h1>
    <button class="go" id="new">＋ Album mới</button>
  </div>
  <section class="plan" id="pro" hidden>
    <div class="plan-h"><b id="planTitle"></b><p class="hint" id="planSub"></p></div>
    <form class="redeem" id="redeem">
      <input type="text" id="code" placeholder="CUOI-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Mã kích hoạt">
      <button class="go" type="submit">Kích hoạt</button>
    </form>
    <p class="note" id="codeMsg" role="status"></p>
  </section>
  <p class="note" id="msg" role="status"></p>
  <div class="albums" id="list"></div>
  <div class="empty" id="empty" hidden>Chưa có album nào. Bấm <b>Album mới</b> để làm slide đầu tiên.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const user = await requireUser();
  const client = await sb();
  $("email").textContent = user.email || "";
  $("out").onclick = signOut;
  const STYLE = { lux: "Vàng champagne", korea: "Hàn Quốc", cinema: "Cinematic", modern: "Hiện đại", vintage: "Vintage", floral: "Hoa pastel", red: "Song Hỷ", mono: "Đen trắng", garden: "Sân vườn" };

  async function load() {
    const { data: albums, error } = await client.from("albums").select("id,groom,bride,wedding_date,style,updated_at").order("updated_at", { ascending: false });
    if (error) { $("msg").textContent = "Chưa tải được album: " + error.message; return; }
    const { data: covers } = await client.from("album_photos").select("album_id,path,position").eq("position", 0);
    const coverPath = Object.fromEntries((covers || []).map((c) => [c.album_id, c.path]));
    const paths = Object.values(coverPath);
    const signed = paths.length ? (await client.storage.from("media").createSignedUrls(paths, 3600)).data || [] : [];
    const urlOf = Object.fromEntries(signed.map((s) => [s.path, s.signedUrl]));

    const list = $("list");
    list.innerHTML = "";
    $("empty").hidden = albums.length > 0;
    for (const a of albums) {
      const el = document.createElement("div");
      el.className = "album";
      el.innerHTML = `<a class="cover" href="/studio.html?album=${a.id}"></a><div class="meta"><b></b><small></small></div><div class="act"><a class="btn" href="/studio.html?album=${a.id}">Mở</a><button class="danger" data-del>Xóa</button></div>`;
      const cover = el.querySelector(".cover");
      const u = urlOf[coverPath[a.id]];
      if (u) { const img = document.createElement("img"); img.src = u; img.alt = ""; cover.appendChild(img); }
      else { const s = document.createElement("span"); s.textContent = "Chưa có ảnh"; cover.appendChild(s); }
      el.querySelector("b").textContent = (a.groom || "Chú rể") + " & " + (a.bride || "Cô dâu");
      el.querySelector("small").textContent = [fmtDate(a.wedding_date), STYLE[a.style]].filter(Boolean).join(" · ");
      const del = el.querySelector("[data-del]");
      del.onclick = async () => {
        if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "Bấm lần nữa để xóa hẳn"; return; }
        del.disabled = true;
        await removeAlbum(a.id);
        load();
      };
      list.appendChild(el);
    }
  }

  async function removeAlbum(id) {
    const folder = user.id + "/" + id;
    for (const sub of ["photos", "music"]) {
      const { data } = await client.storage.from("media").list(folder + "/" + sub, { limit: 1000 });
      if (data && data.length) await client.storage.from("media").remove(data.map((f) => folder + "/" + sub + "/" + f.name));
    }
    await client.from("albums").delete().eq("id", id);
  }

  $("new").onclick = async () => {
    $("new").disabled = true;
    const { data, error } = await client.from("albums").insert({}).select("id").single();
    if (error) { $("msg").textContent = "Chưa tạo được album: " + error.message; $("new").disabled = false; return; }
    location.href = "/studio.html?album=" + data.id;
  };

  const KIND = { wedding: "Gói 1 đám cưới", studio: "Gói studio", year: "Gói 1 năm" };
  function showPlan(p) {
    $("pro").hidden = !!p.missing;
    $("adminLink").hidden = !p.admin;
    $("planTitle").textContent = p.until ? "Đang dùng bản Pro" : p.pro ? "Bản Pro (quản trị)" : "Bản miễn phí";
    $("planSub").textContent = p.until
      ? `${KIND[p.kind] || "Pro"}, dùng đến hết ngày ${fmtTime(p.until)}. Có mã mới thì nhập tiếp, số ngày được cộng dồn.`
      : p.pro ? "Tài khoản quản trị luôn có Pro." : "Tối đa 10 ảnh mỗi album, 3 phong cách, video 720p, album in 20 cm, có dòng chữ nhỏ ở góc và ít lượt AI. Pro mở hết: không giới hạn ảnh, đủ 9 phong cách, video Full HD, album 25 và 30 cm, không có chữ. Có mã Pro thì nhập vào đây.";
  }
  showPlan(await myPlan());
  const ERR = { invalid: "Mã không đúng hoặc đã bị khoá.", used: "Mã này đã có người dùng rồi.", already_yours: "Bạn đã kích hoạt mã này rồi.",
    too_many: "Nhập sai quá nhiều lần hôm nay, mai thử lại nhé.", signed_out: "Bạn cần đăng nhập lại." };
  $("redeem").onsubmit = async (e) => {
    e.preventDefault();
    const code = $("code").value.trim(), btn = $("redeem").querySelector("button");
    if (!code) return;
    btn.disabled = true; $("codeMsg").classList.remove("err"); $("codeMsg").textContent = "Đang kiểm tra mã...";
    const { data, error } = await client.rpc("redeem_code", { p_code: code });
    btn.disabled = false;
    if (error || !data || data.error) { $("codeMsg").classList.add("err"); $("codeMsg").textContent = ERR[data && data.error] || "Chưa kích hoạt được: " + (error ? error.message : "lỗi"); return; }
    $("code").value = ""; $("codeMsg").textContent = "Kích hoạt xong, chúc mừng bạn!";
    showPlan(await myPlan(true));
  };

  load();
})();
</script>
</body>
</html>
