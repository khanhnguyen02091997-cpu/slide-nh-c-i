<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Album của tôi · Slide Ảnh Cưới</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="/albums.html">Slide Ảnh Cưới <em>trọn bộ</em></a>
  <div class="who"><span id="email"></span><button id="out">Đăng xuất</button></div>
</div>
<div class="page">
  <div class="sec-h">
    <h1>Album <em>của tôi</em></h1>
    <button class="go" id="new">＋ Album mới</button>
  </div>
  <p class="note" id="msg" role="status"></p>
  <div class="albums" id="list"></div>
  <div class="empty" id="empty" hidden>Chưa có album nào. Bấm <b>Album mới</b> để làm slide đầu tiên.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const user = await requireUser();
  const client = await sb();
  $("email").textContent = user.email || "";
  $("out").onclick = signOut;
  const STYLE = { lux: "Vàng champagne", korea: "Hàn Quốc", cinema: "Cinematic", modern: "Hiện đại", vintage: "Vintage", floral: "Hoa pastel", red: "Song Hỷ", mono: "Đen trắng", garden: "Sân vườn" };

  async function load() {
    const { data: albums, error } = await client.from("albums").select("id,groom,bride,wedding_date,style,updated_at").order("updated_at", { ascending: false });
    if (error) { $("msg").textContent = "Chưa tải được album: " + error.message; return; }
    const { data: covers } = await client.from("album_photos").select("album_id,path,position").eq("position", 0);
    const coverPath = Object.fromEntries((covers || []).map((c) => [c.album_id, c.path]));
    const paths = Object.values(coverPath);
    const signed = paths.length ? (await client.storage.from("media").createSignedUrls(paths, 3600)).data || [] : [];
    const urlOf = Object.fromEntries(signed.map((s) => [s.path, s.signedUrl]));

    const list = $("list");
    list.innerHTML = "";
    $("empty").hidden = albums.length > 0;
    for (const a of albums) {
      const el = document.createElement("div");
      el.className = "album";
      el.innerHTML = `<a class="cover" href="/studio.html?album=${a.id}"></a><div class="meta"><b></b><small></small></div><div class="act"><a class="btn" href="/studio.html?album=${a.id}">Mở</a><button class="danger" data-del>Xóa</button></div>`;
      const cover = el.querySelector(".cover");
      const u = urlOf[coverPath[a.id]];
      if (u) { const img = document.createElement("img"); img.src = u; img.alt = ""; cover.appendChild(img); }
      else { const s = document.createElement("span"); s.textContent = "Chưa có ảnh"; cover.appendChild(s); }
      el.querySelector("b").textContent = (a.groom || "Chú rể") + " & " + (a.bride || "Cô dâu");
      el.querySelector("small").textContent = [fmtDate(a.wedding_date), STYLE[a.style]].filter(Boolean).join(" · ");
      const del = el.querySelector("[data-del]");
      del.onclick = async () => {
        if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "Bấm lần nữa để xóa hẳn"; return; }
        del.disabled = true;
        await removeAlbum(a.id);
        load();
      };
      list.appendChild(el);
    }
  }

  async function removeAlbum(id) {
    const folder = user.id + "/" + id;
    for (const sub of ["photos", "music"]) {
      const { data } = await client.storage.from("media").list(folder + "/" + sub, { limit: 1000 });
      if (data && data.length) await client.storage.from("media").remove(data.map((f) => folder + "/" + sub + "/" + f.name));
    }
    await client.from("albums").delete().eq("id", id);
  }

  $("new").onclick = async () => {
    $("new").disabled = true;
    const { data, error } = await client.from("albums").insert({}).select("id").single();
    if (error) { $("msg").textContent = "Chưa tạo được album: " + error.message; $("new").disabled = false; return; }
    location.href = "/studio.html?album=" + data.id;
  };

  load();
})();
</script>
</body>
</html>
