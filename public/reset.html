<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đặt lại mật khẩu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth">
  <h1>Đặt lại <em>mật khẩu</em></h1>
  <section>
    <form id="form" class="fields" style="grid-template-columns:1fr" novalidate>
      <label class="f">Mật khẩu mới<input type="password" id="pw" autocomplete="new-password" minlength="6" required></label>
      <button class="go" type="submit">Lưu mật khẩu</button>
    </form>
    <p class="note" id="msg" role="status"></p>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/common.js"></script>
<script>
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("pw").value;
  if (pw.length < 6) { $("msg").textContent = "Mật khẩu cần ít nhất 6 ký tự."; return; }
  const client = await sb();
  const { error } = await client.auth.updateUser({ password: pw });
  $("msg").textContent = error ? "Link đã hết hạn, gửi lại email đặt lại mật khẩu nhé." : "Đã đổi mật khẩu.";
  if (!error) setTimeout(() => location.replace("/albums.html"), 800);
});
</script>
</body>
</html>
